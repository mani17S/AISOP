name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Tests (Offline)
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend
      ENVIRONMENT: development
      CI: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Upgrade pip and install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Git cannot store the read-only attribute that test_case_files_are_read_only_on_disk checks
      # (docs/10_Research/Evaluation/Sufficiency_Labelling_Workflow.md).
      - name: Mark evaluation case files read-only
        run: |
          chmod a-w datasets/sufficiency_eval/dev/cases/*.json datasets/sufficiency_eval/heldout/cases/*.json

      # Failed test names are also written as annotations, so they are readable without opening the log.
      - name: Run offline backend tests
        run: |
          set -o pipefail
          pytest -m "not postgres and not ollama" --verbose -rfE | tee pytest-output.log || {
            grep -E '^(FAILED|ERROR) ' pytest-output.log | head -n 10 | sed 's/^/::error::/'
            exit 1
          }

  frontend:
    name: Frontend Tests, Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The test library jsdom 31 does not run on Node 20 (it needs 22.22.2+, 24.15+ or 26+).
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies cleanly from lockfile
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run component unit tests
        run: npm test

      - name: Build frontend production bundle
        run: npm run build

  dependency-audit:
    name: Python Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Run pip-audit vulnerability scan
        run: |
          pip-audit -r requirements.txt

