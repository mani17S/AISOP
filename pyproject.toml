[project]
name = "aisop"
version = "0.1.0"
description = "AI Security Investigation & Operations Platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
markers = [
    "postgres: marks tests requiring live PostgreSQL (deselect with '-m \"not postgres\"')",
    "ollama: marks tests requiring a live Ollama daemon with nomic-embed-text pulled (subset of postgres)",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
