# AISOP Alembic Configuration (Project Root)

[alembic]
# Path to migration environment scripts
script_location = backend/app/db/migrations

# Prepended to sys.path
prepend_sys_path = backend

# Template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Version locations specification
version_locations = %(here)s/backend/app/db/migrations/versions
path_separator = os

# Database URL is dynamically populated from app.core.config.get_settings().DATABASE_URL
# Can be overridden here or via CLI flag (-x url=...)
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
