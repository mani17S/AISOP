# ==============================================================================
# AISOP Hardened Private LAN TLS Reverse Proxy Configuration Template
# Reference Requirement: REQ-9.3 (Milestone P4-HARDENING-04)
#
# PURPOSE:
# Terminate TLS 1.2/1.3 on a private local network, forward verified client IP
# headers to the AISOP FastAPI backend and React frontend, enforce strict
# HTTP security headers, prevent untrusted Host header spoofing, and isolate
# PostgreSQL (5433/5432) from the external LAN.
#
# STATUS: CONFIGURATION TEMPLATE ONLY (INACTIVE UNTIL OPERATOR DEPLOYMENT)
# DO NOT COMMIT PRIVATE KEYS OR LIVE CERTIFICATES INTO THE REPOSITORY.
# ==============================================================================

# User and process architecture
user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --------------------------------------------------------------------------
    # Logging Architecture & Privacy Preservation
    # --------------------------------------------------------------------------
    log_format aisop_combined '$remote_addr - $remote_user [$time_local] '
                             '"$request_method $scheme://$host$request_uri $server_protocol" '
                             '$status $body_bytes_sent "$http_referer" '
                             '"$http_user_agent" rt=$request_time uct="$upstream_connect_time" '
                             'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log aisop_combined;

    # --------------------------------------------------------------------------
    # Performance & Network Tuning
    # --------------------------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Information disclosure mitigation: conceal Nginx server version
    server_tokens off;

    # --------------------------------------------------------------------------
    # Request Body Size & Buffer Tuning for Security Evidence Ingestion
    # --------------------------------------------------------------------------
    # Default Nginx 1M body size blocks multi-megabyte Sysmon/Zeek telemetry batches.
    # Set to 50M to support batch ingestion at /api/v1/evidence/ingest.
    client_max_body_size 50M;

    # Ingress request-rate limit (OWASP A04): per-client-address bucket applied to /api/. The backend has its own limiter;
    # this one sheds floods before they reach Python. Tune rate/burst to the analyst team size.
    limit_req_zone $binary_remote_addr zone=aisop_api:10m rate=30r/s;
    limit_req_status 429;
    client_body_buffer_size 1M;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # Upstream communication timeouts (accommodates LLM report synthesis)
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 120s;

    # --------------------------------------------------------------------------
    # Upstream Service Definitions
    # --------------------------------------------------------------------------
    upstream aisop_backend {
        # Backend FastAPI Application
        # Standalone host: 127.0.0.1:8000
        # Docker Compose network: aisop-backend:8000
        server __AISOP_BACKEND_HOST__:__AISOP_BACKEND_PORT__;
        keepalive 32;
    }

    upstream aisop_frontend {
        # Frontend Application (Vite Preview or Containerized Static Host)
        # Standalone host: 127.0.0.1:3000
        # Docker Compose network: aisop-frontend:3000
        server __AISOP_FRONTEND_HOST__:__AISOP_FRONTEND_PORT__;
        keepalive 16;
    }

    # --------------------------------------------------------------------------
    # Catch-All Default Server Block (Host Spoofing & Scanning Mitigation)
    # --------------------------------------------------------------------------
    # Rejects requests targeting undefined hostnames, direct IP scans, or untrusted SNI.
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 444; # Connection closed without response
    }

    # --------------------------------------------------------------------------
    # Plaintext HTTP to HTTPS Canonical Redirection Block
    # --------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name __AISOP_SERVER_NAME__;

        # Health probe exemption (allows internal liveness probe over HTTP if required)
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
        }

        # Canonical redirect to TLS port
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --------------------------------------------------------------------------
    # Primary Hardened HTTPS Server Block
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;

        server_name __AISOP_SERVER_NAME__;

        # ----------------------------------------------------------------------
        # TLS Certificate & Key Configuration (Placeholders)
        # ----------------------------------------------------------------------
        # Operator must supply valid certificates issued by enterprise internal CA
        # or offline private Root CA.
        ssl_certificate     __AISOP_TLS_CERT_PATH__; # e.g. /etc/ssl/certs/aisop.crt
        ssl_certificate_key __AISOP_TLS_KEY_PATH__;  # e.g. /etc/ssl/private/aisop.key

        # ----------------------------------------------------------------------
        # Hardened TLS Cryptographic Parameters
        # ----------------------------------------------------------------------
        # Enforce modern TLS versions only (TLSv1.0 and TLSv1.1 prohibited)
        ssl_protocols TLSv1.2 TLSv1.3;

        # High-security AEAD cipher suites (Mozilla Modern / Intermediate Profile)
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;

        # Session cache and tickets (PFS optimization)
        ssl_session_timeout 1d;
        ssl_session_cache shared:AISOP_SSL:10m;
        ssl_session_tickets off;

        # ----------------------------------------------------------------------
        # Defense-in-Depth Security Headers
        # ----------------------------------------------------------------------
        # Strict-Transport-Security (HSTS): Enforce HTTPS for 1 year across subdomains
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # MIME sniffing protection
        add_header X-Content-Type-Options "nosniff" always;

        # Clickjacking & Framing protection
        add_header X-Frame-Options "DENY" always;

        # Referrer Policy: Leak only origin across domains, none to plaintext
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Browser capability permissions restriction
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;

        # Cross-origin isolation of the browsing context group
        add_header Cross-Origin-Opener-Policy "same-origin" always;

        # Content-Security-Policy. Set HERE (server level) and NOT inside a location: nginx drops every inherited add_header
        # in a location that declares any add_header of its own, which silently removed HSTS and the other headers above
        # from the SPA responses. The SPA is same-origin behind this proxy, so connect-src is 'self' only.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

        # ----------------------------------------------------------------------
        # Standard Reverse Proxy Forwarding Headers
        # ----------------------------------------------------------------------
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Sanitize X-Forwarded-For: overwrite with connecting client IP to prevent spoofing
        proxy_set_header X-Forwarded-For $remote_addr;

        # Signal TLS protocol to backend for secure link generation and HSTS middleware
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # ----------------------------------------------------------------------
        # Routing: Backend REST API Endpoints
        # ----------------------------------------------------------------------
        location /api/ {
            limit_req zone=aisop_api burst=60 nodelay;
            proxy_pass http://aisop_backend;

            # Deduplicate security headers: FastAPI SecurityHeadersMiddleware already emits these
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Permissions-Policy;

            # Buffering for synchronous API calls
            proxy_buffering on;
            proxy_buffers 8 16k;
            proxy_busy_buffers_size 32k;
        }

        # ----------------------------------------------------------------------
        # Routing: Health & Readiness Subsystem Probes
        # ----------------------------------------------------------------------
        location /health {
            proxy_pass http://aisop_backend;
            access_log off;
        }

        # ----------------------------------------------------------------------
        # Routing: OpenAPI Documentation (blocked)
        # ----------------------------------------------------------------------
        # Swagger/Redoc/OpenAPI describe every endpoint and are development-only in the backend. Blocked here as defence in depth.
        location = /api/v1/openapi.json { return 404; }
        location ~ ^/(docs|redoc|openapi\.json) { return 404; }

        # ----------------------------------------------------------------------
        # Routing: Frontend React Application (SPA)
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://aisop_frontend;

            # Do not cache index.html (SPA updates). `expires` is used instead of add_header on purpose: a location-level
            # add_header would drop the server-level security headers (see the Content-Security-Policy note above).
            location = /index.html {
                proxy_pass http://aisop_frontend;
                expires -1;
            }
        }
    }
}
