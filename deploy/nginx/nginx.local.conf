# AISOP local TLS reverse proxy (lab / viva). Serves the built frontend and forwards /api to the backend on the host.
# Not the hardened production template (that is nginx.conf, with certificate placeholders). Differences, on purpose:
#  * a self-signed certificate for localhost / 127.0.0.1 (generated by scripts/proxy_up.ps1, kept OUTSIDE the repository);
#  * HSTS is NOT sent here: browsers apply HSTS per host, not per port, so on localhost it could lock http://localhost dev servers to HTTPS.
#    Send it from the production server block only (it is in nginx.conf).
#  * /docs, /redoc and the OpenAPI file are blocked at the proxy (the backend exposes them unconditionally).
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    client_max_body_size 6m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    server {
        listen 8443 ssl;
        http2 on;
        server_name localhost 127.0.0.1;

        ssl_certificate     /etc/nginx/tls/local.crt;
        ssl_certificate_key /etc/nginx/tls/local.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_tickets off;

        # Security headers as real response headers (frame-ancestors is ignored in a meta CSP).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;

        root /usr/share/nginx/html;
        index index.html;

        # API documentation is not served through the proxy.
        location = /api/v1/openapi.json { return 404; }
        location ~ ^/(docs|redoc) { return 404; }

        location /api/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://host.docker.internal:8010;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;   # overwritten, never appended: a client cannot forge it
            proxy_set_header X-Forwarded-Proto https;
            proxy_hide_header X-Frame-Options;                # the proxy sets its own copy; avoid duplicates
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Permissions-Policy;
            proxy_hide_header X-Content-Type-Options;
            proxy_read_timeout 330s;                          # an AI explanation can take minutes on a small local model
        }

        location = /health {
            proxy_pass http://host.docker.internal:8010/api/v1/health;
        }

        location / {
            try_files $uri /index.html;
            expires -1;   # Cache-Control: no-cache. No add_header here: a location-level add_header would drop the server-level security headers.
        }
    }
}
